name: tlc-connect-ci
on:
  push:
    paths: ['tlc-connect/**']
  pull_request:
    paths: ['tlc-connect/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tlc-connect/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: tlc-connect/backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: node --check ../extension/content.js && node --check ../extension/background.js
