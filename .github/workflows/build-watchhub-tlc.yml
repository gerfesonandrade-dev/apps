name: Build Watch Hub TLC APK

on:
  push:
    branches:
      - build-watchhub-tlc-v0.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: watchhub-tlc-v01
        run: gradle assembleDebug
      - name: Rename APK
        run: cp watchhub-tlc-v01/app/build/outputs/apk/debug/app-debug.apk WatchHubTLC-v0.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchHubTLC-v0.1
          path: WatchHubTLC-v0.1.apk
